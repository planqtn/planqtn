name: Job Execution Checks
run-name: ${{ github.actor }} is checking the Job Execution 🚀
on:
  pull_request:
    paths:
      - "planqtn/**"
      - "pyproject.toml"
      - "uv.lock"

      - "app/conftest.py"

      - "app/planqtn_jobs/**"
      - "check/jobs**"
      - ".github/workflows/jobs_checks.yml"
      - "app/planqtn_types/**"
  push:
    branches:
      - main
      - develop
      - "hotfix/**"
    paths:
      - "planqtn/**"
      - "pyproject.toml"
      - "uv.lock"
      - "app/conftest.py"

      - "app/planqtn_jobs/**"
      - "check/jobs**"
      - ".github/workflows/jobs_checks.yml"
      - "app/planqtn_types/**"

jobs:
  Job-Checks:
    strategy:
      matrix:
        python-version: ["3.12"]

    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade uv
          uv sync --group jobs --python ${{ matrix.python-version }} --frozen
          echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
      - name: Run tests
        run: |
          check/jobs
